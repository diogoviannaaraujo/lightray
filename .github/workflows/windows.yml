name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'tools/vectors/**'
      - 'apple/core/Tests/LightrayCoreTests/Fixtures/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'tools/vectors/**'
      - 'apple/core/Tests/LightrayCoreTests/Fixtures/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      CARGO_TERM_COLOR: always
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.203'
          cache: true
          cache-dependency-path: 'windows/ui/**/packages.lock.json'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-x64-rust-1.98-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-x64-rust-1.98-
      - name: Validate, build, test the ABI, and package both applications
        run: ./windows/scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: lightray-windows-x64
          path: |
            windows/artifacts/*.zip
            windows/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
