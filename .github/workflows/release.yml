name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Apple Silicon executables
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64

      - name: Validate release version
        id: version
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apple/mac-client/App/Info.plist)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CFBundleShortVersionString must use MAJOR.MINOR.PATCH."
            exit 1
          fi
          if [[ "$IS_TAG" == true && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must match v$version from apple/mac-client/App/Info.plist."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test shared Apple core
        run: swift test --package-path apple/core

      - name: Test Mac host and build client
        run: |
          swift test --package-path apple/mac-host
          swift build --package-path apple/mac-client

      - name: Build iPad simulator app
        run: |
          xcodebuild -project apple/ios-client/Lightray.xcodeproj -scheme Lightray \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/lightray-ios" build

      - name: Check protocol examples and documentation
        run: swift run --package-path tools/vectors lightray-vectors check

      - name: Build and package app
        run: python3 apple/scripts/package-app.py --app all --sign - --output "$RUNNER_TEMP/lightray-app"

      - name: Package command-line executables and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/lightray-app/Lightray-$VERSION-arm64.dmg" dist/
          cp "$RUNNER_TEMP/lightray-app/LightrayHost-$VERSION-arm64.dmg" dist/
          client_bin=$(swift build -c release --package-path apple/mac-client --arch arm64 --show-bin-path)
          host_bin=$(swift build -c release --package-path apple/mac-host --arch arm64 --show-bin-path)
          lipo -verify_arch arm64 "$client_bin/lightray-client"
          lipo -verify_arch arm64 "$host_bin/lightray-host"
          COPYFILE_DISABLE=1 tar -czf "dist/Lightray-$VERSION-macos-arm64-cli.tar.gz" \
            -C "$client_bin" lightray-client -C "$host_bin" lightray-host
          cd dist
          shasum -a 256 ./*.dmg ./*.tar.gz > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lightray-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows x64 applications
    needs: build
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.build.outputs.version }}

  release:
    name: Create draft GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lightray-*
          path: downloads

      - name: Collect release files and checksums
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir dist
          cp downloads/lightray-macos-arm64/*.dmg downloads/lightray-macos-arm64/*.tar.gz dist/
          for app in Host Client; do
            cp "downloads/lightray-windows-x64/Lightray-$app-win-x64.zip" "dist/Lightray-$app-$VERSION-win-x64.zip"
          done
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create draft release with executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > release-notes.md <<'EOF'
          ### macOS

          Requires an Apple Silicon Mac running macOS 27 or later.

          - Install Lightray from its DMG to connect to other computers.
          - Install Lightray Host from its separate DMG to share this Mac. Start Sharing enables its background service now and at login; Stop Sharing keeps it off.
          - Quit the old combined Lightray app before replacing it. Existing pairing and client preferences are preserved.
          - Grant capture and input permissions to Lightray Host and its service as requested during setup.
          - The CLI archive contains the standalone `lightray-client` and `lightray-host` executables.

          These builds are ad-hoc signed and are not notarized. macOS Gatekeeper may block them.

          ### Windows

          Requires Windows 11 x64. The host is tested on NVIDIA GPUs (RTX 4090) at 1080p60.

          - Extract the Host or Client zip outside `%LOCALAPPDATA%\Programs`, then run its `Install.ps1` in PowerShell.
          - Installing the client alone installs no sharing agent. Installing the host does not enable sharing; open Lightray Host and choose Start Sharing.
          - Allow `lightray-host-agent.exe` through Windows Firewall on the private profile (UDP 7373 by default).

          These builds are unsigned. Windows SmartScreen may warn before running them.

          Verify downloads with `shasum -a 256 -c SHA256SUMS.txt` (or `sha256sum -c` on Linux).
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --draft --title "Lightray $VERSION" \
            --notes-file release-notes.md --generate-notes
