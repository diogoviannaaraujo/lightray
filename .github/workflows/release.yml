name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload both iOS and macOS clients to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Serialize distributions across main, tags and manual runs. Keep every pending push.
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'apple-distribution' }}
  queue: max
  cancel-in-progress: false

jobs:
  checks:
    name: Validate Apple clients and protocol
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = arm64

      - name: Validate release version
        id: version
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          args=()
          if [[ "$IS_TAG" == true ]]; then args+=("$GITHUB_REF_NAME"); fi
          version=$(python3 apple/scripts/release-version.py "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test shared Apple core
        run: swift test --package-path apple/core

      - name: Test TestFlight processing checks
        run: python3 -m unittest discover -s apple/scripts/tests

      - name: Test Mac host and build client
        run: |
          swift test --package-path apple/mac-host
          swift build --package-path apple/mac-client

      - name: Test iPad simulator app
        run: |
          simulator=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, group in devices.items() if "iOS-27" in runtime
                     for d in group if "iPad" in d["name"]))')
          xcodebuild -project apple/ios-client/Lightray.xcodeproj -scheme Lightray \
            -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath "$RUNNER_TEMP/lightray-ios" test

      - name: Check protocol examples and documentation
        run: swift run --package-path tools/vectors lightray-vectors check

  build:
    name: Sign and notarize macOS DMGs
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      version: ${{ needs.checks.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Developer ID secrets
        id: signing
        env:
          REQUIRE_SIGNING: ${{ github.event_name == 'push' }}
          CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            if [[ "$REQUIRE_SIGNING" == true ]]; then
              echo "::error::Main and tagged releases must be signed; set the Developer ID secrets listed in apple/README.md."
              exit 1
            fi
            echo "::warning::Developer ID secrets are not set; packaging with ad-hoc signatures."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in CERTIFICATE_PASSWORD API_KEY API_KEY_ID API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty; set every Developer ID secret listed in apple/README.md."
              exit 1
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        id: certificate
        if: steps.signing.outputs.enabled == 'true'
        uses: ./.github/actions/import-signing-identity
        with:
          p12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          password: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          kind: Developer ID Application
          # Developer ID certificates come from the original CA (until 2027-02-01) or from G2.
          intermediates: DeveloperIDCA DeveloperIDG2CA

      - name: Build and package app
        env:
          IDENTITY: ${{ steps.certificate.outputs.identity || '-' }}
        run: python3 apple/scripts/package-app.py --app all --sign "$IDENTITY" --build-number "${{ github.run_number }}.${{ github.run_attempt }}" --output "$RUNNER_TEMP/lightray-app"

      - name: Build and sign command-line executables
        env:
          IDENTITY: ${{ steps.certificate.outputs.identity || '-' }}
        run: |
          cli="$RUNNER_TEMP/lightray-cli"
          mkdir -p "$cli"
          client_bin=$(swift build -c release --package-path apple/mac-client --arch arm64 --show-bin-path)
          host_bin=$(swift build -c release --package-path apple/mac-host --arch arm64 --show-bin-path)
          cp "$client_bin/lightray-client" "$host_bin/lightray-host" "$cli/"
          for tool in lightray-client lightray-host; do
            lipo -verify_arch arm64 "$cli/$tool"
            if [[ "$IDENTITY" != - ]]; then
              codesign --force --sign "$IDENTITY" --options runtime --timestamp \
                --identifier "com.getlightray.${tool#lightray-}.cli" "$cli/$tool"
            fi
            codesign --verify --strict --verbose=2 "$cli/$tool"
          done

      - name: Notarize disk images and command-line executables
        if: steps.signing.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/notary-key.p8"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          notarize() {
            local result id status
            result=$(xcrun notarytool submit "$1" --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 20m --output-format json) || true
            if ! id=$(plutil -extract id raw -o - - <<< "$result") ||
               ! status=$(plutil -extract status raw -o - - <<< "$result"); then
              echo "::error::notarytool could not submit $(basename "$1"): $result"
              return 1
            fi
            echo "$(basename "$1"): $status ($id)"
            if [[ "$status" != Accepted ]]; then
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary-key.p8" \
                --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
              echo "::error::Apple did not notarize $(basename "$1")."
              return 1
            fi
          }
          app_dir="$RUNNER_TEMP/lightray-app"
          ditto -c -k "$RUNNER_TEMP/lightray-cli" "$RUNNER_TEMP/lightray-cli.zip"
          notarize "$RUNNER_TEMP/lightray-cli.zip"
          for dmg in "$app_dir/Lightray-$VERSION-arm64.dmg" "$app_dir/LightrayHost-$VERSION-arm64.dmg"; do
            notarize "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done
          spctl --assess --type execute --verbose=2 "$app_dir/Lightray.app" "$app_dir/Lightray Host.app"

      - name: Package command-line executables and checksums
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/lightray-app/Lightray-$VERSION-arm64.dmg" dist/
          cp "$RUNNER_TEMP/lightray-app/LightrayHost-$VERSION-arm64.dmg" dist/
          COPYFILE_DISABLE=1 tar -czf "dist/Lightray-$VERSION-macos-arm64-cli.tar.gz" \
            -C "$RUNNER_TEMP/lightray-cli" lightray-client lightray-host
          cd dist
          shasum -a 256 ./*.dmg ./*.tar.gz > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lightray-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keychain
        if: always() && steps.certificate.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

  windows:
    name: Build Windows x64 applications
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: checks
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.checks.outputs.version }}

  testflight:
    name: Upload iPad app to TestFlight
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PROJECT: apple/ios-client/Lightray.xcodeproj
      # Build settings of the Lightray app target's Release configuration.
      APP_RELEASE: objects.A10000000000000000000013.buildSettings
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check TestFlight secrets and version
        id: app
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE }}
          API_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD PROFILE API_KEY API_KEY_ID API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty; set every TestFlight secret listed in apple/README.md."
              exit 1
            fi
          done
          marketing=$(plutil -extract "$APP_RELEASE.MARKETING_VERSION" raw -o - "$PROJECT/project.pbxproj")
          if [[ "$marketing" != "$VERSION" ]]; then
            echo "::error::The iPad MARKETING_VERSION ($marketing) must match $VERSION."
            exit 1
          fi
          bundle_id=$(plutil -extract "$APP_RELEASE.PRODUCT_BUNDLE_IDENTIFIER" raw -o - "$PROJECT/project.pbxproj")
          echo "bundle-id=$bundle_id" >> "$GITHUB_OUTPUT"

      - name: Import Apple Distribution certificate
        id: certificate
        uses: ./.github/actions/import-signing-identity
        with:
          p12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          password: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          kind: Apple Distribution
          intermediates: AppleWWDRCAG3

      - name: Install App Store provisioning profile
        id: profile
        env:
          PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle-id }}
        run: |
          profile="$RUNNER_TEMP/app-store.mobileprovision"
          base64 --decode <<< "$PROFILE" > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/app-store-profile.plist"
          field() { plutil -extract "$1" raw -o - "$RUNNER_TEMP/app-store-profile.plist"; }
          team=$(field TeamIdentifier.0)
          if [[ "$(field Entitlements.application-identifier)" != "$team.$BUNDLE_ID" ]]; then
            echo "::error::IOS_APP_STORE_PROFILE is not a profile for $BUNDLE_ID."
            exit 1
          fi
          if field ProvisionedDevices > /dev/null 2>&1; then
            echo "::error::IOS_APP_STORE_PROFILE lists devices; use an App Store Connect distribution profile."
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$(field UUID).mobileprovision"
          done
          echo "Profile \"$(field Name)\" for team $team expires $(field ExpirationDate)."
          echo "name=$(field Name)" >> "$GITHUB_OUTPUT"
          echo "team=$team" >> "$GITHUB_OUTPUT"

      - name: Archive iPad app
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          TEAM: ${{ steps.profile.outputs.team }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          # Sign only the app target: Swift package targets reject a provisioning profile
          # given on the command line. plutil cannot write Xcode's text project format, so
          # the project is converted to XML, which Xcode also reads.
          project="$PROJECT/project.pbxproj"
          plutil -convert xml1 "$project"
          plutil -replace "$APP_RELEASE.CODE_SIGN_STYLE" -string Manual "$project"
          plutil -replace "$APP_RELEASE.DEVELOPMENT_TEAM" -string "$TEAM" "$project"
          plutil -replace "$APP_RELEASE.CODE_SIGN_IDENTITY" -string "Apple Distribution" "$project"
          plutil -replace "$APP_RELEASE.PROVISIONING_PROFILE_SPECIFIER" -string "$PROFILE_NAME" "$project"
          xcodebuild archive -project "$PROJECT" -scheme Lightray -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Lightray.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/lightray-ios-archive" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to TestFlight
        env:
          BUNDLE_ID: ${{ steps.app.outputs.bundle-id }}
          TEAM: ${{ steps.profile.outputs.team }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          API_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          python3 - "$options" <<'EOF'
          import os, plistlib, sys
          with open(sys.argv[1], 'wb') as destination:
              plistlib.dump({
                  'method': 'app-store-connect',
                  'teamID': os.environ['TEAM'],
                  'signingStyle': 'manual',
                  'signingCertificate': 'Apple Distribution',
                  'provisioningProfiles': {os.environ['BUNDLE_ID']: os.environ['PROFILE_NAME']},
                  'manageAppVersionAndBuildNumber': False,
              }, destination)
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lightray.xcarchive" \
            -exportPath "$RUNNER_TEMP/lightray-ipa" -exportOptionsPlist "$options"
          ipa=$(find "$RUNNER_TEMP/lightray-ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          trap 'rm -f "$RUNNER_TEMP/app-store-connect.p8"' EXIT
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/app-store-connect.p8"
          xcrun altool --upload-package "$ipa" --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID" \
            --p8-file-path "$RUNNER_TEMP/app-store-connect.p8" --wait
          python3 apple/scripts/testflight-status.py --platform IOS \
            --version "${{ needs.checks.outputs.version }}" \
            --build-number "${{ github.run_number }}.${{ github.run_attempt }}" \
            --key "$RUNNER_TEMP/app-store-connect.p8"

      - name: Preserve iOS TestFlight package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightray-testflight-ios
          path: ${{ runner.temp }}/lightray-ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing keychain
        if: always() && steps.certificate.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

  testflight-macos:
    name: Upload native macOS client to TestFlight
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check macOS TestFlight secrets
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          PROFILE: ${{ secrets.MACOS_APP_STORE_PROFILE }}
          INSTALLER: ${{ secrets.MACOS_INSTALLER_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD PROFILE INSTALLER INSTALLER_PASSWORD API_KEY API_KEY_ID API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty; see the macOS TestFlight secrets in apple/README.md."
              exit 1
            fi
          done

      - name: Import Apple Distribution certificate
        id: certificate
        uses: ./.github/actions/import-signing-identity
        with:
          p12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          password: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          kind: Apple Distribution
          intermediates: AppleWWDRCAG3

      - name: Import Mac Installer Distribution certificate
        id: installer
        uses: ./.github/actions/import-signing-identity
        with:
          p12: ${{ secrets.MACOS_INSTALLER_P12 }}
          password: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          kind: 3rd Party Mac Developer Installer
          intermediates: AppleWWDRCAG3
          policy: basic
          keychain-name: lightray-installer

      - name: Package sandboxed macOS client for TestFlight
        env:
          IDENTITY: ${{ steps.certificate.outputs.identity }}
          INSTALLER_IDENTITY: ${{ steps.installer.outputs.identity }}
          PROFILE: ${{ secrets.MACOS_APP_STORE_PROFILE }}
        run: |
          base64 --decode <<< "$PROFILE" > "$RUNNER_TEMP/mac-app-store.provisionprofile"
          python3 apple/scripts/package-app.py --app client --no-dmg \
            --sign "$IDENTITY" --installer-sign "$INSTALLER_IDENTITY" \
            --app-store-profile "$RUNNER_TEMP/mac-app-store.provisionprofile" \
            --build-number "${{ github.run_number }}.${{ github.run_attempt }}" \
            --output "$RUNNER_TEMP/lightray-macos-testflight"

      - name: Upload and verify macOS TestFlight processing
        env:
          API_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/mac-app-store-connect.p8"' EXIT
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/mac-app-store-connect.p8"
          xcrun altool --upload-package "$RUNNER_TEMP/lightray-macos-testflight/Lightray-$VERSION-macos.pkg" \
            --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID" \
            --p8-file-path "$RUNNER_TEMP/mac-app-store-connect.p8" --wait
          python3 apple/scripts/testflight-status.py --platform MAC_OS --version "$VERSION" \
            --build-number "${{ github.run_number }}.${{ github.run_attempt }}" \
            --key "$RUNNER_TEMP/mac-app-store-connect.p8"

      - name: Preserve macOS TestFlight package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightray-testflight-macos
          path: ${{ runner.temp }}/lightray-macos-testflight/*.pkg
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing assets
        if: always()
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
          INSTALLER_KEYCHAIN: ${{ steps.installer.outputs.keychain }}
        run: |
          rm -f "$RUNNER_TEMP/mac-app-store.provisionprofile"
          if [[ -n "$KEYCHAIN" ]]; then security delete-keychain "$KEYCHAIN"; fi
          if [[ -n "$INSTALLER_KEYCHAIN" ]]; then security delete-keychain "$INSTALLER_KEYCHAIN"; fi

  release:
    name: Create draft GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, build, windows, testflight, testflight-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lightray-*
          path: downloads

      - name: Collect release files and checksums
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          mkdir dist
          cp downloads/lightray-macos-arm64/*.dmg downloads/lightray-macos-arm64/*.tar.gz dist/
          for app in Host Client; do
            cp "downloads/lightray-windows-x64/Lightray-$app-win-x64.zip" "dist/Lightray-$app-$VERSION-win-x64.zip"
          done
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create draft release with executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          cat > release-notes.md <<'EOF'
          ### macOS

          Requires an Apple Silicon Mac running macOS 27 or later.

          - Install Lightray from its DMG to connect to other computers.
          - Install Lightray Host from its separate DMG to share this Mac. Start Sharing enables its background service now and at login; Stop Sharing keeps it off.
          - Quit the old combined Lightray app before replacing it. Existing pairing and client preferences are preserved.
          - Grant capture and input permissions to Lightray Host and its service as requested during setup.
          - The CLI archive contains the standalone `lightray-client` and `lightray-host` executables.

          The apps, disk images, and CLI executables are signed with Developer ID and notarized by Apple.

          ### Windows

          Requires Windows 11 x64. The host is tested on NVIDIA GPUs (RTX 4090) at 1080p60.

          - Extract the Host or Client zip outside `%LOCALAPPDATA%\Programs`, then run its `Install.ps1` in PowerShell.
          - Installing the client alone installs no sharing agent. Installing the host does not enable sharing; open Lightray Host and choose Start Sharing.
          - Allow `lightray-host-agent.exe` through Windows Firewall on the private profile (UDP 7373 by default).

          These builds are unsigned. Windows SmartScreen may warn before running them.

          Verify downloads with `shasum -a 256 -c SHA256SUMS.txt` (or `sha256sum -c` on Linux).
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --draft --title "Lightray $VERSION" \
            --notes-file release-notes.md --generate-notes
