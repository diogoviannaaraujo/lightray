name: Import signing identity
description: >-
  Import a .p12 signing identity into a temporary keychain that codesign and xcodebuild search.
  Delete the keychain at the end of the job.

inputs:
  p12:
    description: The certificate and private key exported as .p12, base64-encoded
    required: true
  password:
    description: The .p12 export password
    required: true
  kind:
    description: The certificate type to use, such as "Developer ID Application" or "Apple Distribution"
    required: true
  intermediates:
    description: Apple intermediate certificates to add, named as under apple.com/certificateauthority
    required: true

outputs:
  identity:
    description: SHA-1 hash of the imported signing identity
    value: ${{ steps.import.outputs.identity }}
  keychain:
    description: Path of the temporary keychain
    value: ${{ steps.import.outputs.keychain }}

runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        P12: ${{ inputs.p12 }}
        PASSWORD: ${{ inputs.password }}
        KIND: ${{ inputs.kind }}
        INTERMEDIATES: ${{ inputs.intermediates }}
      run: |
        keychain="$RUNNER_TEMP/lightray-signing.keychain-db"
        keychain_password=$(openssl rand -base64 32)
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
        base64 --decode <<< "$P12" > "$RUNNER_TEMP/signing.p12"
        security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$PASSWORD" \
          -T /usr/bin/codesign
        rm "$RUNNER_TEMP/signing.p12"
        # The .p12 may omit Apple's intermediate certificate, or already carry it.
        for ca in $INTERMEDIATES; do
          curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
          if ! output=$(security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" 2>&1) &&
             [[ "$output" != *"already exists"* ]]; then
            echo "$output"
            exit 1
          fi
        done
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
        security list-keychains -d user -s "$keychain" "$(security default-keychain -d user | tr -d ' "')"
        identity=$(security find-identity -v -p codesigning "$keychain" |
          awk -v kind="\"$KIND: " 'index($0, kind) { print $2; exit }')
        if [[ -z "$identity" ]]; then
          echo "::error::The .p12 holds no valid $KIND identity."
          security find-identity -p codesigning "$keychain"
          exit 1
        fi
        security find-identity -v -p codesigning "$keychain" | grep "$identity"
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
