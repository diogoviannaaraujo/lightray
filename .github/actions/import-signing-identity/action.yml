name: Import signing identity
description: >-
  Import a .p12 signing identity into a temporary keychain that codesign and xcodebuild search.
  Delete the keychain at the end of the job.

inputs:
  p12:
    description: The certificate and private key exported as .p12, base64-encoded
    required: true
  password:
    description: The .p12 export password
    required: true
  kind:
    description: The certificate type to use, such as "Developer ID Application" or "Apple Distribution"
    required: true
  intermediates:
    description: Apple intermediate certificates to add, named as under apple.com/certificateauthority
    required: true
  policy:
    description: Keychain identity policy (basic for installer certificates)
    default: codesigning
  keychain-name:
    description: Unique name when importing multiple identities in one job
    default: lightray-signing
  trusted-tool:
    description: Executable allowed to use this private key without an interactive keychain prompt
    default: /usr/bin/codesign

outputs:
  identity:
    description: SHA-1 hash of the imported signing identity
    value: ${{ steps.import.outputs.identity }}
  keychain:
    description: Path of the temporary keychain
    value: ${{ steps.import.outputs.keychain }}
  name:
    description: Certificate common name, as required by productbuild
    value: ${{ steps.import.outputs.name }}

runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        P12: ${{ inputs.p12 }}
        PASSWORD: ${{ inputs.password }}
        KIND: ${{ inputs.kind }}
        INTERMEDIATES: ${{ inputs.intermediates }}
        POLICY: ${{ inputs.policy }}
        KEYCHAIN_NAME: ${{ inputs.keychain-name }}
        TRUSTED_TOOL: ${{ inputs.trusted-tool }}
      run: |
        keychain="$RUNNER_TEMP/$KEYCHAIN_NAME.keychain-db"
        keychain_password=$(openssl rand -base64 32)
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
        base64 --decode <<< "$P12" > "$RUNNER_TEMP/signing.p12"
        security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$PASSWORD" \
          -T "$TRUSTED_TOOL"
        rm "$RUNNER_TEMP/signing.p12"
        # The .p12 may omit Apple's intermediate certificate, or already carry it.
        for ca in $INTERMEDIATES; do
          curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
          if ! output=$(security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" 2>&1) &&
             [[ "$output" != *"already exists"* ]]; then
            echo "$output"
            exit 1
          fi
        done
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
        existing=()
        while IFS= read -r entry; do
          existing+=("$(sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//' <<< "$entry")")
        done < <(security list-keychains -d user)
        security list-keychains -d user -s "$keychain" "${existing[@]}"
        identity=$(security find-identity -v -p "$POLICY" "$keychain" |
          awk -v kind="\"$KIND: " 'index($0, kind) { print $2; exit }')
        if [[ -z "$identity" ]]; then
          echo "::error::The .p12 holds no valid $KIND identity."
          security find-identity -p "$POLICY" "$keychain"
          exit 1
        fi
        security find-identity -v -p "$POLICY" "$keychain" | grep "$identity"
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
        name=$(security find-identity -v -p "$POLICY" "$keychain" |
          awk -F '"' -v identity="$identity" 'index($0, identity) { print $2; exit }')
        echo "name=$name" >> "$GITHUB_OUTPUT"
