[package]
name = "lightray-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
hmac = "0.12.1"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
subtle = "=2.6.1"
thiserror = "2.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
